spring.application.name=mentorconnect

# Server configuration
server.port=8080

# MySQL JDBC Connectivity
spring.datasource.url=jdbc:mysql://localhost:3306/mentorconnect_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console (available for in-memory or fallback checks)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
